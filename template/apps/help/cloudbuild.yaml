# template/apps/help/cloudbuild.yaml
#
# Cloud Build トリガから呼ばれる。発火条件: main push かつ
# template/apps/help/** または template/{CLAUDE,README,DEPLOY}.md 変更時。
#
# ステップ:
#   1. bundle-docs : template/{CLAUDE,README,DEPLOY}.md を
#                    template/apps/help/server/docs/ にコピー
#                    (Gemini が読む system prompt のソース)
#   2. build       : Kaniko で Docker build & push
#   3. deploy      : Cloud Run にデプロイ
#   4. prep-config : Cloud Run URL を apps/config.js に注入 (window.API_BASE_HELP)
#   5. ensure-hosting-site : Firebase Hosting site を冪等作成
#   6. deploy-hosting      : Hosting にデプロイ

substitutions:
  _APP: help
  _REGION: asia-northeast1
  _SERVICE: help-api
  _REPO: claude-studio
  _SA: help-run
  # Cloud Run の invoker (組織ポリシーが allUsers を弾く場合に備えて owner も追加)。
  # 値は bootstrap.sh が env から流し込むか、初回デプロイ前に手動で書き換える。
  _INVOKER: user:OWNER_EMAIL_PLACEHOLDER
  # /api/* を叩けるメールの allowlist (空なら任意の認証ユーザー)。
  _ALLOWED_EMAILS: ""
  # Firebase Hosting site id (グローバルにユニーク)。
  _HOSTING_SITE: HOSTING_SITE_PLACEHOLDER

steps:
  - id: bundle-docs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        mkdir -p template/apps/help/server/docs
        # 配布テンプレが持つ運用ドキュメントを Gemini の知識ベースに。
        # ファイルが無くてもビルドは止めない (best-effort)。
        for f in CLAUDE.md README.md DEPLOY.md; do
          if [ -f "template/$f" ]; then
            cp "template/$f" "template/apps/help/server/docs/$f"
            echo "  bundled: $f ($(wc -c < template/apps/help/server/docs/$f) bytes)"
          else
            echo "  skip: template/$f (not found)"
          fi
        done

  - id: build
    name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:latest
      - --context=dir://template/apps/${_APP}/server
      - --cache=true
      - --cache-ttl=336h
      - --cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}-cache
      - --snapshot-mode=redo
      - --use-new-run

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest
      - --set-env-vars=^||^FIREBASE_PROJECT_ID=$PROJECT_ID||ALLOWED_EMAILS=${_ALLOWED_EMAILS}
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

  - id: prep-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # 組織ポリシーが allUsers を弾く環境向けに owner principal も付与。
        # 個人プロジェクトなら allUsers のみで足りる。
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} \
          --member=allUsers \
          --role=roles/run.invoker --quiet || true
        if [ "${_INVOKER}" != "user:OWNER_EMAIL_PLACEHOLDER" ]; then
          gcloud run services add-iam-policy-binding ${_SERVICE} \
            --region=${_REGION} \
            --member=${_INVOKER} \
            --role=roles/run.invoker --quiet || true
        fi
        RUN_URL=$$(gcloud run services describe ${_SERVICE} \
          --region=${_REGION} --format='value(status.url)')
        echo "API_BASE_HELP = $$RUN_URL"
        # 既存の apps/config.js を破壊せず、help 専用の変数を追記。
        # ランチャー側は window.API_BASE_HELP を読む。
        CFG=template/apps/config.js
        touch $$CFG
        # 既存の API_BASE_HELP 行を消してから追記 (冪等)
        grep -v 'API_BASE_HELP' $$CFG > $$CFG.tmp || true
        mv $$CFG.tmp $$CFG
        echo "window.API_BASE_HELP='$$RUN_URL';" >> $$CFG

  - id: ensure-hosting-site
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_HOSTING_SITE}" = "HOSTING_SITE_PLACEHOLDER" ]; then
          echo "skipping ensure-hosting-site (_HOSTING_SITE is placeholder)"
          exit 0
        fi
        TOKEN=$$(gcloud auth print-access-token)
        curl -s -X POST \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
          "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites?siteId=${_HOSTING_SITE}" \
          -d '{}' || true
        echo "hosting site ensured: ${_HOSTING_SITE}"

  - id: deploy-hosting
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm install -g firebase-tools@13 --silent --no-audit --no-fund
        firebase deploy --only hosting \
          --project=$PROJECT_ID \
          --config=template/firebase.json \
          --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
