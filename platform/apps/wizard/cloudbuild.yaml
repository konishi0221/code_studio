# platform/apps/wizard/cloudbuild.yaml
#
# Cloud Build トリガから呼ばれる。発火条件: main push かつ
# platform/apps/wizard/** 変更時。
#
# ステップ:
#   1. build       : Kaniko で Docker build & push
#   2. deploy      : Cloud Run にデプロイ (wizard-api)
#   3. prep-config : Cloud Run URL を apps/config.js に注入 (window.API_BASE_WIZARD)
#   4. ensure-hosting-site : Firebase Hosting site を冪等作成
#   5. deploy-hosting      : Hosting にデプロイ (apps/ 全体)
#
# help/cloudbuild.yaml と並走することがある (両方が hosting を deploy する)。
# Firebase Hosting deploy は冪等なので重複しても害なし、最後勝ち。

substitutions:
  _APP: wizard
  _REGION: asia-northeast1
  _SERVICE: wizard-api
  _REPO: claude-studio
  _SA: wizard-run
  _INVOKER: user:OWNER_EMAIL_PLACEHOLDER
  # /api/* を叩けるメールの allowlist (空なら任意の認証 Google ユーザー)。
  # wizard はエンドユーザー (= 任意の Google アカウント) が来る前提なので
  # デフォルトは空で誰でも叩ける。owner のみに絞る運用なら ALLOWED_EMAILS を埋める。
  _ALLOWED_EMAILS: ""
  _HOSTING_SITE: HOSTING_SITE_PLACEHOLDER

steps:
  - id: build
    name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:latest
      - --context=dir://platform/apps/${_APP}/server
      - --cache=true
      - --cache-ttl=336h
      - --cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}-cache
      - --snapshot-mode=redo
      - --use-new-run

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=^||^FIREBASE_PROJECT_ID=$PROJECT_ID||ALLOWED_EMAILS=${_ALLOWED_EMAILS}
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

  - id: prep-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} \
          --member=allUsers \
          --role=roles/run.invoker --quiet || true
        if [ "${_INVOKER}" != "user:OWNER_EMAIL_PLACEHOLDER" ]; then
          gcloud run services add-iam-policy-binding ${_SERVICE} \
            --region=${_REGION} \
            --member=${_INVOKER} \
            --role=roles/run.invoker --quiet || true
        fi
        RUN_URL=$$(gcloud run services describe ${_SERVICE} \
          --region=${_REGION} --format='value(status.url)')
        echo "API_BASE_WIZARD = $$RUN_URL"
        CFG=platform/apps/config.js
        touch $$CFG
        grep -v 'API_BASE_WIZARD' $$CFG > $$CFG.tmp || true
        mv $$CFG.tmp $$CFG
        echo "window.API_BASE_WIZARD='$$RUN_URL';" >> $$CFG

  - id: ensure-hosting-site
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_HOSTING_SITE}" = "HOSTING_SITE_PLACEHOLDER" ]; then
          echo "skipping ensure-hosting-site (_HOSTING_SITE is placeholder)"
          exit 0
        fi
        TOKEN=$$(gcloud auth print-access-token)
        curl -s -X POST \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
          "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites?siteId=${_HOSTING_SITE}" \
          -d '{}' || true
        echo "hosting site ensured: ${_HOSTING_SITE}"

  - id: deploy-hosting
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('platform/firebase.json'));
          cfg.hosting.site = '${_HOSTING_SITE}';
          fs.writeFileSync('platform/firebase.json', JSON.stringify(cfg, null, 2));
          console.log('  injected site: ' + cfg.hosting.site);
        "
        npm install -g firebase-tools@13 --silent --no-audit --no-fund
        firebase deploy --only hosting \
          --project=$PROJECT_ID \
          --config=platform/firebase.json \
          --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
